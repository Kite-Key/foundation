name: .NET CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore KiteKey.sln
      - run: dotnet test KiteKey.sln --no-restore --configuration Release
      - run: dotnet pack KiteKey.sln --no-restore --configuration Release --output artifacts
      - uses: actions/upload-artifact@v5
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
