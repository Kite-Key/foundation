name: Publish NuGet packages
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'Kite-Key/foundation' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Validate release tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          git merge-base --is-ancestor HEAD origin/main
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - run: dotnet restore KiteKey.sln
      - run: dotnet test KiteKey.sln --no-restore --configuration Release
      - run: dotnet pack KiteKey.sln --no-restore --configuration Release --output artifacts -p:PackageVersion=${{ env.PACKAGE_VERSION }}
      - name: Exchange GitHub OIDC for a short-lived NuGet API key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish under configured NuGet organization
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for package in artifacts/KiteKey.*.nupkg; do
            dotnet nuget push "$package" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          done
